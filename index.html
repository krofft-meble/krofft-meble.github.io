<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="KROFFT creates bespoke furniture and interiors. Choose your preferred language."
    />
    <title>Choose language | KROFFT</title>
    <meta property="og:title" content="Choose language | KROFFT" />
    <meta
      property="og:description"
      content="KROFFT creates bespoke furniture and interiors. Choose your preferred language."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://krofft.pl/" />
    <meta name="theme-color" content="#0b1926" />
    <link rel="canonical" href="https://krofft.pl/en/" />
    <link rel="alternate" hreflang="pl" href="https://krofft.pl/pl/" />
    <link rel="alternate" hreflang="en" href="https://krofft.pl/en/" />
    <link rel="alternate" hreflang="de" href="https://krofft.pl/de/" />
    <link rel="alternate" hreflang="nb" href="https://krofft.pl/no/" />
    <link rel="alternate" hreflang="x-default" href="https://krofft.pl/en/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <script>
      (function () {
        const languages = (
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || ""]
        ).map((language) => language.toLowerCase());

        let locale = "en";
        for (const language of languages) {
          if (language.startsWith("pl")) {
            locale = "pl";
            break;
          }
          if (language.startsWith("de")) {
            locale = "de";
            break;
          }
          if (
            language.startsWith("nb") ||
            language.startsWith("no") ||
            language.startsWith("nn")
          ) {
            locale = "no";
            break;
          }
          if (language.startsWith("en")) break;
        }

        window.location.replace("/" + locale + "/");
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/fonts.css" />
  </head>
  <body class="language-gate">
    <main class="language-gate__card">
      <a class="language-gate__brand" href="/en/" aria-label="KROFFT">
        <span class="language-gate__brand-mark" aria-hidden="true"></span>
      </a>
      <p class="language-gate__eyebrow">Bespoke furniture &amp; interiors</p>
      <h1>Choose your language</h1>
      <p class="language-gate__intro">
        Select a language to continue to our website.
      </p>
      <nav aria-label="Available languages">
        <ul class="language-gate__options">
          <li>
            <a href="/pl/" lang="pl">
              <span>Polski</span>
              <span class="language-gate__code">
                PL <span aria-hidden="true">&rarr;</span>
              </span>
            </a>
          </li>
          <li>
            <a href="/en/" lang="en">
              <span>English</span>
              <span class="language-gate__code">
                EN <span aria-hidden="true">&rarr;</span>
              </span>
            </a>
          </li>
          <li>
            <a href="/de/" lang="de">
              <span>Deutsch</span>
              <span class="language-gate__code">
                DE <span aria-hidden="true">&rarr;</span>
              </span>
            </a>
          </li>
          <li>
            <a href="/no/" lang="nb">
              <span>Norsk</span>
              <span class="language-gate__code">
                NO <span aria-hidden="true">&rarr;</span>
              </span>
            </a>
          </li>
        </ul>
      </nav>
      <noscript>
        <p class="language-gate__notice">
          JavaScript is disabled. Choose a language above to continue.
        </p>
      </noscript>
    </main>
  </body>
</html>
