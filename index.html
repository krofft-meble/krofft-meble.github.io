<!doctype html>
<html class="h-full" lang="x-default">
  <head>
    <script>
      try {
        const referrer = document.referrer;
        if (referrer && new URL(referrer).origin !== window.location.origin) {
          sessionStorage.setItem("krofftConsentReturnTo", referrer);
        }
      } catch (error) {
        console.error("Nie udało się zapisać poprzedniej strony.", error);
      }

      const language = (
        navigator.languages?.[0] ||
        navigator.language ||
        navigator.userLanguage ||
        ""
      ).toLowerCase();
      const destination = language.startsWith("pl")
        ? "/pl/"
        : language.startsWith("de")
          ? "/de/"
          : language.startsWith("nb") || language.startsWith("no")
            ? "/no/"
            : "/en/";
      window.location.replace(destination);
    </script>
